openapi: 3.1.0
info:
  title: oh-my-usage API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    This spec is the source of truth: the Go server (`api/rest`) and the web
    client (`web/src/api`) are generated from it.
servers:
  - url: /
    description: Same-origin API server
# No authentication. Listen on loopback or a private network only.
security: []
tags:
  - name: system
    description: Daemon metadata and the event stream.
  - name: accounts
    description: The logins and API keys an omp auth gateway serves, with their usage.
  - name: traffic
    description: Requests, tokens and cost passing through the gateway, read from the broker.
paths:
  /api/v1/config:
    get:
      operationId: getConfig
      tags: [system]
      summary: Read the public configuration
      description: >-
        What the UI needs before it can render: the daemon's name and build,
        and whether accounts can be paused. The same object is injected into
        `index.html` as `window.__CONFIG__`, so the first render does not wait
        for this request; the UI reads it from there and refetches later.
      responses:
        '200':
          description: The public configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List accounts and their usage
      description: >-
        The accounts found by the last poll of the gateway, joined with the
        broker's credentials when a broker is configured. While a source is
        unreachable its last good data is still listed; `gateway` and `broker`
        say how fresh it is.
      responses:
        '200':
          description: The accounts and the health of their sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/accounts/{accountId}/pause:
    put:
      operationId: setAccountPaused
      tags: [accounts]
      summary: Pause or resume an account
      description: >-
        A pause blocks the account in omp's `account-policy` scope on the
        broker. omp moves traffic off it within seconds, but still falls back
        to it when every other account of the provider is blocked or
        exhausted. Answers 409 when no broker is configured or the account has
        no broker credential.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseRequest'
      responses:
        '200':
          description: The account as the broker now reports it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/accounts/{accountId}/history:
    get:
      operationId: getAccountHistory
      tags: [accounts]
      summary: Read an account's recorded usage
      description: >-
        One sample per limit each time the provider reported fresh usage,
        oldest first. An account with nothing recorded answers an empty list.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: since
          in: query
          description: Only samples at or after this time. Defaults to 7 days ago.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The samples.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageHistory'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/trends:
    get:
      operationId: listUsageTrends
      tags: [accounts]
      summary: Read every account's usage, thinned for small charts
      description: >-
        The recorded usage of every limit of every account since `since`,
        thinned to about 60 points per limit: the time from the first sample
        in the period to now is cut into equal steps and each keeps its first
        sample. A limit with nothing recorded in the period is left out.
      parameters:
        - name: since
          in: query
          description: Only samples at or after this time. Defaults to 7 days ago.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One trend per limit that has samples.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageTrendList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/traffic:
    get:
      operationId: getTraffic
      tags: [traffic]
      summary: Read what is passing through the gateway
      description: >-
        Requests, tokens and their cost at API prices, as the broker counts
        them: totals for the last hour, day and week, the last hour by minute,
        the last week by hour, and the week by client. Traffic is measured
        from the daemon's first reading of the broker on. What came before,
        and what passed while the daemon was stopped for over an hour, is an
        estimate known to the hour: it counts in the day, the week and the
        series by hour, and not in the last hour or the series by minute.
        Without a broker `available` is false and the rest is empty.
      responses:
        '200':
          description: The traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Traffic'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/stream:
    get:
      operationId: streamEvents
      tags: [system]
      summary: Stream the accounts and the traffic
      description: >-
        Server-sent events, each carrying a whole object. `accounts`: an
        `AccountList`, sent on connect and after every poll. `traffic`: a
        `Traffic`, sent on connect and after every collection, when a broker
        is configured. A `: ping` comment keeps idle connections open. Every
        event is complete, so a client that reconnects needs no resume cursor.
      responses:
        '200':
          description: Server-sent `accounts` and `traffic` events.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AccountList'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: An account's `id`.
      schema:
        type: string
        pattern: '^[0-9a-f]{16}$'
  responses:
    Problem:
      description: An error, as an RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Config:
      type: object
      description: Public, unauthenticated configuration. Never put a secret here.
      required: [name, version, controls, pollIntervalSeconds]
      properties:
        name:
          type: string
          description: The daemon's display name.
          examples: [oh-my-usage]
        version:
          type: string
          description: The build's version.
          examples: ['0.1.0']
        controls:
          type: boolean
          description: Whether a broker is configured, so accounts can be paused.
        pollIntervalSeconds:
          type: integer
          minimum: 1
          description: How often the gateway is polled.
    AccountList:
      type: object
      required: [accounts, gateway]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        gateway:
          $ref: '#/components/schemas/SourceStatus'
        gatewayVersion:
          type: string
          description: The omp version the gateway reported.
          examples: ['18.19.0']
        broker:
          $ref: '#/components/schemas/SourceStatus'
          description: Absent when no broker is configured.
    SourceStatus:
      type: object
      description: The health of the gateway or the broker.
      required: [reachable]
      properties:
        reachable:
          type: boolean
          description: Whether the last poll of it succeeded.
        error:
          type: string
          description: Why the last poll failed.
        updatedAt:
          type: string
          format: date-time
          description: The last successful poll. Absent before the first.
    Account:
      type: object
      description: One login or API key with its usage.
      required: [id, provider, paused, pausable, blocks, limits]
      properties:
        id:
          type: string
          description: Stable across restarts.
          examples: [3f6c2a9d41b07e58]
        provider:
          type: string
          description: omp's provider ID.
          examples: [anthropic]
        kind:
          type: string
          enum: [oauth, api_key]
          description: Absent when no broker credential is known for the account.
        email:
          type: string
        orgName:
          type: string
        plan:
          type: string
          examples: [pro]
        paused:
          type: boolean
          description: Whether the account carries a pause.
        pausable:
          type: boolean
          description: Whether the account has a broker credential to pause.
        blockedUntil:
          type: string
          format: date-time
          description: >-
            When omp's own block on the account ends, such as after a usage
            limit. Absent when it has none.
        blocks:
          type: array
          description: omp's own live blocks on the account, the one that ends last first. A pause is not among them.
          items:
            $ref: '#/components/schemas/Block'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'
        resets:
          $ref: '#/components/schemas/Resets'
        fetchedAt:
          type: string
          format: date-time
          description: When the provider reported the usage. Absent without a report.
    Limit:
      type: object
      description: One usage window of an account.
      required: [id, label]
      properties:
        id:
          type: string
          examples: ['anthropic:7d']
        label:
          type: string
          examples: [Claude 7 Day]
        windowLabel:
          type: string
          examples: [7 Day]
        usedFraction:
          type: number
          minimum: 0
          description: >-
            The used share, 0 to 1 and above 1 for overage. Absent when the
            provider reported no amount.
        status:
          type: string
          enum: [ok, warning, exhausted, unknown]
        resetsAt:
          type: string
          format: date-time
          description: When the window resets. Absent when the provider gave no time.
        windowSeconds:
          type: integer
          minimum: 1
          description: How long the window lasts. Absent when the provider did not say.
    Resets:
      type: object
      description: An account's saved limit resets.
      required: [available]
      properties:
        available:
          type: integer
          minimum: 0
          description: How many the account holds.
        usable:
          type: integer
          minimum: 0
          description: How many can be spent now. Absent when the provider does not say.
        soonestExpiresAt:
          type: string
          format: date-time
          description: When the first of them expires.
        saved:
          type: array
          description: The resets the provider described. It may list fewer than `available`.
          items:
            $ref: '#/components/schemas/SavedReset'
    SavedReset:
      type: object
      description: One limit reset an account holds and has not spent.
      required: [clears]
      properties:
        title:
          type: string
          description: The provider's name for it. Absent when it gave none.
        usable:
          type: boolean
          description: Whether it can be spent now. Absent when the provider does not say.
        clears:
          type: array
          description: The `id` of each limit that spending it would reset.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: When it expires. Absent when it does not.
    Block:
      type: object
      description: A block omp put on an account. Until it ends omp sends the account no traffic in its scope.
      required: [scope, until]
      properties:
        scope:
          type: string
          description: What the block covers, as omp names it.
        until:
          type: string
          format: date-time
    PauseRequest:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean
    UsageHistory:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          items:
            $ref: '#/components/schemas/UsageSample'
    UsageSample:
      type: object
      description: One limit at the time its provider reported it.
      required: [at, limitId, label, usedFraction]
      properties:
        at:
          type: string
          format: date-time
        limitId:
          type: string
        label:
          type: string
        usedFraction:
          type: number
          minimum: 0
        resetsAt:
          type: string
          format: date-time
    UsageTrendList:
      type: object
      required: [trends]
      properties:
        trends:
          type: array
          items:
            $ref: '#/components/schemas/UsageTrend'
    UsageTrend:
      type: object
      description: One limit of one account over time, oldest first.
      required: [accountId, limitId, points]
      properties:
        accountId:
          type: string
        limitId:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
    TrendPoint:
      type: object
      required: [at, usedFraction]
      properties:
        at:
          type: string
          format: date-time
        usedFraction:
          type: number
          minimum: 0
    Traffic:
      type: object
      description: What is passing through the gateway, as the broker counts it.
      required: [available, windows, minutes, hours, clients]
      properties:
        available:
          type: boolean
          description: Whether a broker is configured. Without one the rest is empty.
        updatedAt:
          type: string
          format: date-time
          description: When traffic was last collected. Absent before the first collection.
        error:
          type: string
          description: Why the last collection failed. Absent when it succeeded.
        measuredSince:
          type: string
          format: date-time
          description: >-
            When traffic began to be measured: the daemon's first reading of
            the broker. What is reported before it is an estimate. Absent
            before the first reading.
        windows:
          type: array
          description: Totals for the last hour, day and week, in that order.
          items:
            $ref: '#/components/schemas/TrafficWindow'
        minutes:
          $ref: '#/components/schemas/TrafficSeries'
        hours:
          $ref: '#/components/schemas/TrafficSeries'
        clients:
          type: array
          description: The last week by client, application and provider, the costliest first.
          items:
            $ref: '#/components/schemas/TrafficClient'
    TrafficCounts:
      type: object
      description: What passed in some stretch of time.
      required: [requests, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd]
      properties:
        requests:
          type: integer
          minimum: 0
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        cacheReadTokens:
          type: integer
          minimum: 0
        cacheWriteTokens:
          type: integer
          minimum: 0
        costUsd:
          type: number
          format: double
          minimum: 0
          description: >-
            What the tokens would cost at the provider's API prices. On a
            subscription nothing is billed per token; it measures work done.
    TrafficWindow:
      type: object
      description: The traffic of a recent period, in total and by provider.
      required: [id, since, total, providers]
      properties:
        id:
          type: string
          enum: [hour, day, week]
        since:
          type: string
          format: date-time
        total:
          $ref: '#/components/schemas/TrafficCounts'
        providers:
          type: array
          description: The providers with traffic in the period, the costliest first.
          items:
            $ref: '#/components/schemas/TrafficProviderCounts'
    TrafficProviderCounts:
      type: object
      required: [provider, counts]
      properties:
        provider:
          type: string
        counts:
          $ref: '#/components/schemas/TrafficCounts'
    TrafficSeries:
      type: object
      description: >-
        Traffic over time in equal steps, the last of them still filling.
        Every array of a provider has one value per step, oldest first.
      required: [start, stepSeconds, steps, providers]
      properties:
        start:
          type: string
          format: date-time
          description: When the first step begins.
        stepSeconds:
          type: integer
          minimum: 1
        steps:
          type: integer
          minimum: 1
        providers:
          type: array
          description: The providers with traffic in the series, the costliest first.
          items:
            $ref: '#/components/schemas/TrafficProviderSeries'
    TrafficProviderSeries:
      type: object
      required: [provider, requests, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd]
      properties:
        provider:
          type: string
        requests:
          type: array
          items:
            type: integer
            minimum: 0
        inputTokens:
          type: array
          description: Input tokens that were not read from a cache.
          items:
            type: integer
            minimum: 0
        outputTokens:
          type: array
          description: Output tokens.
          items:
            type: integer
            minimum: 0
        cacheReadTokens:
          type: array
          description: Input tokens read from a cache.
          items:
            type: integer
            minimum: 0
        cacheWriteTokens:
          type: array
          description: Input tokens written to a cache.
          items:
            type: integer
            minimum: 0
        costUsd:
          type: array
          items:
            type: number
            format: double
            minimum: 0
    TrafficClient:
      type: object
      description: One client's traffic to one provider over the last week.
      required: [installId, hostname, app, provider, counts]
      properties:
        installId:
          type: string
          description: The client installation that sent it.
        hostname:
          type: string
        app:
          type: string
          description: The application that sent it; `gateway` for requests that named none.
        provider:
          type: string
        counts:
          $ref: '#/components/schemas/TrafficCounts'
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
